[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kitlangton/motel"

[workspace.dependencies]
rusqlite = { version = "0.41", features = ["bundled", "functions", "hooks", "limits"] }
libsqlite3-sys = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crossbeam-channel = "0.5"
libc = "0.2"
memchr = "2"

[profile.release]
strip = false
